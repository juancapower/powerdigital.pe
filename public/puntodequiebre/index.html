<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Redirigiendo a Google Drive | Power Digital</title>
    <link rel="canonical" href="https://drive.google.com/drive/folders/125qs-LgVIWt06T7xuH6BkSuoFNOYWTX_?usp=sharing" />
    <meta http-equiv="refresh" content="0; url=https://drive.google.com/drive/folders/125qs-LgVIWt06T7xuH6BkSuoFNOYWTX_?usp=sharing" />
    <script>
      window.location.replace("https://drive.google.com/drive/folders/125qs-LgVIWt06T7xuH6BkSuoFNOYWTX_?usp=sharing");
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f8f9fa;
        color: #0b0d17;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 440px;
        background: #ffffff;
        border: 1px solid rgba(11, 13, 23, 0.1);
        border-radius: 16px;
        padding: 36px 28px;
        box-shadow: 0 20px 50px -24px rgba(11, 13, 23, 0.14);
      }
      .spinner {
        width: 34px;
        height: 34px;
        margin: 0 auto 18px;
        border: 3px solid rgba(67, 97, 238, 0.15);
        border-top-color: #4361ee;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      h1 {
        font-size: 19px;
        font-weight: 700;
        margin: 0 0 8px;
        letter-spacing: -0.02em;
      }
      p {
        font-size: 14px;
        color: rgba(11, 13, 23, 0.68);
        margin: 0 0 22px;
        line-height: 1.55;
      }
      a.btn {
        display: inline-block;
        background-color: #0b0d17;
        color: #ffffff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        padding: 12px 22px;
        border-radius: 10px;
        transition: background-color 0.2s ease;
      }
      a.btn:hover {
        background-color: #4361ee;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="spinner" aria-hidden="true"></div>
      <h1>Redirigiendo a tu carpeta en Google Drive</h1>
      <p>
        En un instante accederás automáticamente al espacio compartido de Punto de Quiebre.
        Si la redirección no inicia, utiliza el enlace directo.
      </p>
      <a
        class="btn"
        href="https://drive.google.com/drive/folders/125qs-LgVIWt06T7xuH6BkSuoFNOYWTX_?usp=sharing"
        rel="noopener noreferrer"
      >
        Abrir en Google Drive
      </a>
    </main>
  </body>
</html>
