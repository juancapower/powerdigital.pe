<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirigiendo a Karla Serna | Power Digital</title>
  <meta http-equiv="refresh" content="0; url=https://drive.google.com/open?id=1r-lVAQIiZrcDmArwttsViyBjOyQJHvrf&usp=drive_fs">
  <link rel="canonical" href="https://drive.google.com/open?id=1r-lVAQIiZrcDmArwttsViyBjOyQJHvrf&usp=drive_fs">
  <script>
    window.location.replace("https://drive.google.com/open?id=1r-lVAQIiZrcDmArwttsViyBjOyQJHvrf&usp=drive_fs");
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #F8F9FA;
      color: #0B0D17;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      padding: 40px 32px;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(11, 13, 23, 0.06);
      max-width: 440px;
      width: 100%;
      border: 1px solid rgba(11, 13, 23, 0.06);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(67, 97, 238, 0.15);
      border-top-color: #4361EE;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #0B0D17;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }
    p {
      font-size: 14px;
      color: #6C7280;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      background-color: #4361EE;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 999px;
      transition: background-color 0.2s, transform 0.15s;
    }
    .btn:hover {
      background-color: #3451DE;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Redirigiendo...</h1>
    <p>Te estamos redirigiendo a los archivos de Karla Serna en Google Drive.</p>
    <a class="btn" href="https://drive.google.com/open?id=1r-lVAQIiZrcDmArwttsViyBjOyQJHvrf&usp=drive_fs">
      Continuar a Google Drive &rarr;
    </a>
  </div>
</body>
</html>
