<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Redirigiendo a tu carpeta | Power Digital</title>
    <meta
      http-equiv="refresh"
      content="0; url=https://drive.google.com/drive/folders/1Xalofgv8jlzYgvB24VAJUeaBvLpYx5jo"
    />
    <link rel="canonical" href="https://drive.google.com/drive/folders/1Xalofgv8jlzYgvB24VAJUeaBvLpYx5jo" />
    <script>
      window.location.replace("https://drive.google.com/drive/folders/1Xalofgv8jlzYgvB24VAJUeaBvLpYx5jo");
    </script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #F8F9FA;
        color: #0B0D17;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: #FFFFFF;
        border: 1px solid rgba(11, 13, 23, 0.08);
        border-radius: 20px;
        padding: 40px 32px;
        max-width: 480px;
        width: 100%;
        text-align: center;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(67, 97, 238, 0.15);
        border-top-color: #4361EE;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 20px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 8px;
        color: #0B0D17;
      }
      p {
        font-size: 14px;
        color: rgba(11, 13, 23, 0.65);
        line-height: 1.5;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #4361EE;
        color: #FFFFFF;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        transition: background-color 0.2s;
      }
      .btn:hover {
        background: #3451DE;
      }
      .brand {
        margin-top: 24px;
        font-size: 12px;
        color: rgba(11, 13, 23, 0.4);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="spinner"></div>
      <h1>Redirigiendo a tu carpeta</h1>
      <p>Te estamos redirigiendo a tu espacio de recursos en Google Drive. Si no carga automáticamente, haz clic en el siguiente botón:</p>
      <a class="btn" href="https://drive.google.com/drive/folders/1Xalofgv8jlzYgvB24VAJUeaBvLpYx5jo">
        Abrir Google Drive
      </a>
      <div class="brand">Power Digital</div>
    </div>
  </body>
</html>
