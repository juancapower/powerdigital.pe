<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=https://drive.google.com/open?id=1MT6W5zPFqrI_SXe1pphmrfox7CnXmCt1&usp=drive_fs">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirigiendo a Hugo DAM - Power Digital</title>
  <link rel="canonical" href="https://powerdigital.pe/hugodam">
  <script>
    window.location.replace("https://drive.google.com/open?id=1MT6W5zPFqrI_SXe1pphmrfox7CnXmCt1&usp=drive_fs");
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0B0D17;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 36px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
    }
    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 28px;
      color: #FFFFFF;
    }
    .logo span {
      color: #4361EE;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(67, 97, 238, 0.2);
      border-top-color: #4361EE;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 24px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 10px;
    }
    p {
      color: #94A3B8;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #4361EE;
      color: #FFFFFF;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(67, 97, 238, 0.4);
    }
    .btn:hover {
      background: #3451DE;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(67, 97, 238, 0.5);
    }
    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Power<span>Digital</span></div>
    <div class="spinner"></div>
    <h1>Redirigiendo a Hugo DAM...</h1>
    <p>Si la redirección no se inicia automáticamente, haz clic en el siguiente botón para acceder directamente:</p>
    <a class="btn" href="https://drive.google.com/open?id=1MT6W5zPFqrI_SXe1pphmrfox7CnXmCt1&usp=drive_fs" rel="noreferrer">
      <span>Abrir en Google Drive</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
    </a>
  </div>
</body>
</html>
