<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="refresh" content="0; url=https://drive.google.com/open?id=1hn1NMOm4IE2sFTz96UxapVm06BHTUAF8&usp=drive_fs" />
    <title>Redirigiendo a tu carpeta de cliente | Anatolia Zapata - Power Digital</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/ddn6qh7ve/image/upload/f_auto,q_auto/v1790715669/PowerDigital_IsotipoTransparente_kinopx.png" />
    <script>
      window.location.replace("https://drive.google.com/open?id=1hn1NMOm4IE2sFTz96UxapVm06BHTUAF8&usp=drive_fs");
    </script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #F8F9FA;
        color: #0B0D17;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: #FFFFFF;
        border: 1px solid rgba(11, 13, 23, 0.08);
        border-radius: 20px;
        padding: 40px 32px;
        max-width: 440px;
        width: 100%;
        text-align: center;
        box-shadow: 0 10px 30px -10px rgba(11, 13, 23, 0.08);
      }
      .logo {
        height: 36px;
        width: auto;
        margin-bottom: 24px;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(67, 97, 238, 0.15);
        border-top-color: #4361EE;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 20px auto;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      h1 {
        font-size: 18px;
        font-weight: 700;
        color: #0B0D17;
        margin-bottom: 8px;
      }
      p {
        font-size: 14px;
        color: rgba(11, 13, 23, 0.65);
        margin-bottom: 24px;
        line-height: 1.5;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background-color: #4361EE;
        color: #FFFFFF;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        padding: 12px 24px;
        border-radius: 12px;
        transition: background-color 0.2s ease;
      }
      .btn:hover {
        background-color: #3651D4;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img
        src="https://res.cloudinary.com/ddn6qh7ve/image/upload/f_auto,q_auto/v1790715607/PowerDigital_LogoHorizontal_Transparente_yfoawp.png"
        alt="Power Digital Logo"
        class="logo"
      />
      <div class="spinner"></div>
      <h1>Redirigiendo a tu carpeta de trabajo</h1>
      <p>Te estamos llevando de forma segura a Google Drive (Anatolia Zapata). Si no redirige automáticamente en unos segundos, haz clic en el botón.</p>
      <a href="https://drive.google.com/open?id=1hn1NMOm4IE2sFTz96UxapVm06BHTUAF8&usp=drive_fs" class="btn">
        Abrir carpeta en Google Drive
      </a>
    </div>
  </body>
</html>
